server:
  port: 28081
  servlet:
    context-path: /api

spring:
  application:
    name: jv-api-gateway-user
  # Nacos 配置中心：optional: 表示 Nacos 未启动时也能正常启动（回落到本地配置）
  config:
    import:
      - optional:nacos:api-jv-api-gateway-common.yaml
      - optional:nacos:api-jv-api-gateway-user.yaml
      - optional:classpath:zimo-common.yml
  # Redis 连接池参数（公共基线之外的覆盖项）：登录失败计数等跨实例共享状态
  data:
    redis:
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 3s

gateway:
  jwt:
    # 生产环境通过环境变量 GATEWAY_JWT_SECRET 注入，且需 >= 32 字节
    secret: ${GATEWAY_JWT_SECRET:api-gateway-platform-jwt-secret-key-change-me-please}
    expire-hours: 8
  sso:
    # SSO IdP（v0.2 第 15 项）：对外元数据 issuer 指向网关；登录页为控制台前端入口
    # （生产同域部署时两者同源；开发态控制台 28080、网关 28090 分离）
    issuer: ${GATEWAY_SSO_ISSUER:http://localhost:28090}
    login-url: ${GATEWAY_SSO_LOGIN_URL:http://localhost:28080/login}
  # 首次启动自动写入的内置账号
  default-admin:
    username: admin
    password: Admin@123

# 平台自身接入：SDK 注册 + 心跳，让「服务发现」页能监控到平台自己的模块
zimo:
  gateway:
    client:
      # 上报共享密钥（X-Gateway-Client-Token）：注册/心跳/采集上报请求携带，与网关 proxy 校验端同值
      client-token: ${GATEWAY_CLIENT_TOKEN:dev-gateway-token}
      server-addr: http://127.0.0.1:28090/api
      app-id: app-api-gateway
      app-name: API网关平台
      service-id: jv-api-gateway-user
      service-name: 网关用户
      port: 28081
      ip: 127.0.0.1
      language: Java 17
      version: 1.0.0
      # 采集已由 jv-api-gateway-proxy 在转发链路完成，模块内不再埋点，避免一条请求记两份
      trace:
        enabled: true
      registry:
        enabled: true
        heartbeat-interval: 30000
