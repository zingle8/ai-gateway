server:
  port: 28081
  servlet:
    context-path: /api

spring:
  application:
    name: jv-api-gateway-user
  # Nacos 配置中心：optional: 表示 Nacos 未启动时也能正常启动（回落到本地配置）
  config:
    import:
      - optional:nacos:api-jv-api-gateway-common.yaml
      - optional:nacos:api-jv-api-gateway-user.yaml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://127.0.0.1:3306/api_gateway?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true"
    username: root
    password: 'Root@123456'
  # Redis：用于登录失败计数等跨实例共享状态。
  # 连接为懒建立，Redis 不可用时服务仍可正常启动，相关逻辑降级为单实例内存计数。
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:Redis@123456}
      timeout: 3s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 3s
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      username: nacos
      password: 'nacos'
      discovery:
        namespace: public
        group: DEFAULT_GROUP
        # 注册失败不阻止服务启动：Nacos 不可用时仍可正常提供接口，仅失去注册发现能力
        fail-fast: false
      config:
        namespace: public
        group: DEFAULT_GROUP
        file-extension: yaml

gateway:
  jwt:
    # 生产环境通过环境变量 GATEWAY_JWT_SECRET 注入，且需 >= 32 字节
    secret: ${GATEWAY_JWT_SECRET:ai-gateway-platform-jwt-secret-key-change-me-please}
    expire-hours: 8
  # 首次启动自动写入的内置账号
  default-admin:
    username: admin
    password: Admin@123

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    # 数据库蛇形命名自动映射到实体驼峰字段
    map-underscore-to-camel-case: true

logging:
  level:
    com.zimo.gateway: info

# 平台自身接入：SDK 注册 + 心跳，让「服务发现」页能监控到平台自己的模块
zimo:
  gateway:
    client:
      server-addr: http://127.0.0.1:28090/api
      app-id: app-gateway
      app-name: API网关平台
      service-name: jv-api-gateway-user
      port: 28081
      ip: 127.0.0.1
      language: Java 17
      version: 1.0.0
      # 采集已由 jv-api-gateway-proxy 在转发链路完成，模块内不再埋点，避免一条请求记两份
      trace:
        enabled: true
      registry:
        enabled: true
        heartbeat-interval: 30000
