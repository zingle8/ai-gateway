server:
  port: 28085
  servlet:
    context-path: /api

spring:
  application:
    name: jv-api-gateway-config
  config:
    import:
      - optional:nacos:api-jv-api-gateway-common.yaml
      - optional:nacos:api-jv-api-gateway-config.yaml
      - optional:classpath:zimo-common.yml
gateway:
  # 平台配置的存储来源（DB / Redis / Nacos 三种，可逐项指定）
  config-store:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      namespace: public
      group: DEFAULT_GROUP
      # 默认 dataId：properties 文本，一个文件承载多个平台配置 key
      data-id: gw-platform-config.properties
      timeout-ms: 3000
  jwt:
    # 与 user 服务共用：verify 只做验签，不签发
    secret: ${GATEWAY_JWT_SECRET:api-gateway-platform-jwt-secret-key-change-me-please}
    expire-hours: 8

# 平台自身接入：心跳上报，让「服务发现」页能监控到本模块
zimo:
  gateway:
    client:
      # 上报共享密钥（X-Gateway-Client-Token）：注册/心跳/采集上报请求携带，与网关 proxy 校验端同值
      client-token: ${GATEWAY_CLIENT_TOKEN:dev-gateway-token}
      server-addr: http://127.0.0.1:28090/api
      app-id: app-api-gateway
      app-name: API网关平台
      service-id: jv-api-gateway-config
      service-name: 配置中心
      port: 28085
      ip: 127.0.0.1
      language: Java 17
      version: 1.0.0
      trace:
        enabled: true
      registry:
        enabled: true
        heartbeat-interval: 30000
      # 入口鉴权（SDK 第二道门）：防止绕过网关直连本服务端口。
      # 验签回调 /open/auth/token/verify（Bearer JWT 与 X-Api-Key 同语义），
      # 公开配置路径必须豁免（控制台刷新与菜单健康免令牌读取）
      auth:
        enabled: true
        exempt-paths:
          - /configs/public
          - /health/**
          - /actuator/**
          - /error
