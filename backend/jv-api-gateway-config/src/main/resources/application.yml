server:
  port: 28085
  servlet:
    context-path: /api

spring:
  application:
    name: jv-api-gateway-config
  config:
    import:
      - optional:nacos:api-jv-api-gateway-common.yaml
      - optional:nacos:api-jv-api-gateway-config.yaml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://127.0.0.1:3306/api_gateway?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true"
    username: root
    password: 'Root@123456'
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:Redis@123456}
      database: 0
      timeout: 3000ms
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      username: nacos
      password: 'nacos'
      discovery:
        namespace: public
        group: DEFAULT_GROUP
        fail-fast: false
      config:
        namespace: public
        group: DEFAULT_GROUP
        file-extension: yaml

gateway:
  # 平台配置的存储来源（DB / Redis / Nacos 三种，可逐项指定）
  config-store:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      namespace: public
      group: DEFAULT_GROUP
      # 默认 dataId：properties 文本，一个文件承载多个平台配置 key
      data-id: gw-platform-config.properties
      timeout-ms: 3000
  jwt:
    # 与 user 服务共用：verify 只做验签，不签发
    secret: ${GATEWAY_JWT_SECRET:ai-gateway-platform-jwt-secret-key-change-me-please}
    expire-hours: 8

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.zimo.gateway: info

# 平台自身接入：心跳上报，让「服务发现」页能监控到本模块
zimo:
  gateway:
    client:
      server-addr: http://127.0.0.1:28090/api
      app-id: app-gateway
      app-name: API网关平台
      service-name: jv-api-gateway-config
      port: 28085
      ip: 127.0.0.1
      language: Java 17
      version: 1.0.0
      trace:
        enabled: true
      registry:
        enabled: true
        heartbeat-interval: 30000
