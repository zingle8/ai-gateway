server:
  port: 28090
  # 网关直接对外提供转发，不设 context-path（业务方按原路径调用）
  shutdown: graceful
  # 允许客户端用 HTTP/2（含明文 h2c）访问网关；HTTP/1.1 客户端自动回落，不受影响
  http2:
    enabled: true

spring:
  application:
    name: jv-gateway-proxy

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://127.0.0.1:3306/api_gateway?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true"
    username: root
    password: 'Root@123456'
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

  cloud:
    gateway:
      # 路由全部来自 tb_gw_route，这里不配置静态路由
      httpclient:
        connect-timeout: 3000
        response-timeout: 30s
      # 不对 OPTIONS 等预检请求做特殊处理，保持原样透传
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true

  task:
    scheduling:
      pool:
        size: 4

# 采集参数
gateway:
  proxy:
    # 请求/响应体最多记录多少字节，超出截断
    max-body-size: 8192

logging:
  level:
    root: info
    com.zimo.gateway.proxy: info
  file:
    name: ../logs/jv-gateway-proxy.log
