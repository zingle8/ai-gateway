server:
  port: 28083
  servlet:
    context-path: /api

spring:
  application:
    name: jv-api-gateway-discovery
  config:
    import:
      - optional:nacos:api-jv-api-gateway-common.yaml
      - optional:nacos:api-jv-api-gateway-discovery.yaml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://127.0.0.1:3306/api_gateway?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true"
    username: root
    password: 'Root@123456'
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      username: nacos
      password: 'nacos'
      discovery:
        namespace: public
        group: DEFAULT_GROUP
        # 注册失败不阻止服务启动：Nacos 不可用时仍可正常提供接口，仅失去注册发现能力
        fail-fast: false
      config:
        namespace: public
        group: DEFAULT_GROUP
        file-extension: yaml

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    # 数据库蛇形命名自动映射到实体驼峰字段
    map-underscore-to-camel-case: true

logging:
  level:
    com.zimo.gateway: info

# 平台自身接入：SDK 注册 + 心跳，让「服务发现」页能监控到平台自己的模块
zimo:
  gateway:
    client:
      # 上报共享密钥（X-Gateway-Client-Token）：注册/心跳/采集上报请求携带，与网关 proxy 校验端同值
      client-token: ${GATEWAY_CLIENT_TOKEN:dev-gateway-token}
      server-addr: http://127.0.0.1:28090/api
      app-id: app-api-gateway
      app-name: API网关平台
      service-id: jv-api-gateway-discovery
      service-name: 服务发现
      port: 28083
      ip: 127.0.0.1
      language: Java 17
      version: 1.0.0
      # 采集已由 jv-api-gateway-proxy 在转发链路完成，模块内不再埋点，避免一条请求记两份
      trace:
        enabled: true
      registry:
        enabled: true
        heartbeat-interval: 30000
