server:
  port: 28090
  # 网关直接对外提供转发，不设 context-path（业务方按原路径调用）
  shutdown: graceful
  # 允许客户端用 HTTP/2（含明文 h2c）访问网关；HTTP/1.1 客户端自动回落，不受影响
  http2:
    enabled: true

spring:
  application:
    name: jv-api-gateway-proxy

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://127.0.0.1:3306/api_gateway?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true"
    username: root
    password: 'Root@123456'
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2

  # Redis：鉴权元数据缓存（Redis 优先，不可用时自动回落本地 Caffeine）
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:Redis@123456}
      timeout: 1s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 1s

  cloud:
    gateway:
      # 路由全部来自 tb_gw_route，这里不配置静态路由
      httpclient:
        connect-timeout: 3000
        response-timeout: 30s
      # 不对 OPTIONS 等预检请求做特殊处理，保持原样透传
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true

  task:
    scheduling:
      pool:
        size: 4

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

# 采集参数
gateway:
  jwt:
    # 与 jv-api-gateway-user 保持一致：user 签发，网关验签（生产经环境变量注入）
    secret: ${GATEWAY_JWT_SECRET:ai-gateway-platform-jwt-secret-key-change-me-please}
  proxy:
    # 请求/响应体最多记录多少字节，超出截断
    max-body-size: 8192
    auth:
      # 网关统一鉴权开关（联调需要临时放开时可设为 false）
      enabled: true
      # 鉴权缓存模式默认值：auto / redis / local
      # 系统设置（platform.auth.cache.mode）可覆盖，30 秒内生效；MySQL 始终为源数据
      cache-mode: auto
      # 免鉴权路径（Ant 风格）：登录 / 注册 / 开放认证 / 菜单健康 / 探活，
      # 以及接入 SDK 上报通道（注册 / 心跳 / 链路采集，业务系统无控制台令牌）
      # 注意：此列表会整体覆盖 GatewayAuthProperties 代码默认值，两边需同步维护
      skip-paths:
        - /api/auth/login
        - /api/auth/register
        - /api/open/**
        - /api/configs/public
        - /health/**
        - /actuator/**
        - /api/discovery/services/register
        - /api/discovery/services/heartbeat
        - /api/discovery/services/deregister
        - /api/trace/logs/batch
        - /api/trace/spans/batch

logging:
  level:
    root: info
    com.zimo.gateway.proxy: info
  file:
    name: ../logs/jv-api-gateway-proxy.log
