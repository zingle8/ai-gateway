server:
  port: 28082
  servlet:
    context-path: /api

spring:
  application:
    name: jv-api-gateway-overview
  config:
    import:
      - optional:nacos:api-jv-api-gateway-common.yaml
      - optional:nacos:api-jv-api-gateway-overview.yaml
      - optional:classpath:zimo-common.yml
      - optional:nacos:gw-platform-infra.properties
# 平台自身接入：SDK 注册 + 心跳，让「服务发现」页能监控到平台自己的模块
zimo:
  gateway:
    client:
      # 上报共享密钥（X-Gateway-Client-Token）：注册/心跳/采集上报请求携带，与网关 proxy 校验端同值
      client-token: ${GATEWAY_CLIENT_TOKEN:dev-gateway-token}
      server-addr: http://127.0.0.1:28090/api
      app-id: app-api-gateway
      app-name: API网关平台
      service-id: jv-api-gateway-overview
      service-name: 网关总览
      port: 28082
      ip: 127.0.0.1
      language: Java 17
      version: 1.0.0
      # 采集已由 jv-api-gateway-proxy 在转发链路完成，模块内不再埋点，避免一条请求记两份
      trace:
        enabled: true
      registry:
        enabled: true
        heartbeat-interval: 30000
