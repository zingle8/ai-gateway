[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jv-gateway"
version = "1.0.0"
description = "AI 网关平台 Python 接入 SDK：注册/心跳/调用日志上报/入口鉴权（零第三方依赖）"
requires-python = ">=3.8"
license = { text = "MIT" }

[tool.setuptools.packages.find]
include = ["jv_gateway*"]
